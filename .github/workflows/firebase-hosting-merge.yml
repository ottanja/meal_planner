name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Recreates the gitignored config from the repository secret.
      # The path must match where app.config.ts imports './firebase.config' from.
      - name: Create firebase config
        run: printf '%s' "$FIREBASE_CONFIG_TS" > src/app/firebase.config.ts
        env:
          FIREBASE_CONFIG_TS: ${{ secrets.FIREBASE_CONFIG_TS }}

      # Fails the run early if the key is missing (prints no secret values)
      - name: Check firebase config
        run: |
          test -s src/app/firebase.config.ts
          grep -q 'apiKey: "AIza' src/app/firebase.config.ts

      - run: npm ci && npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: shared-meal-planner-b9275